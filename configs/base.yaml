project:
  name: cs5180_maddpg_transport
  seed: 42
  device: auto

environment:
  name: simple_spread
  num_agents: 3
  max_cycles: 25
  continuous_actions: true
  local_ratio: 0.5

training:
  total_episodes: 25000
  batch_size: 1024
  replay_capacity: 1000000
  gamma: 0.95
  tau: 0.01
  actor_lr: 0.001
  critic_lr: 0.001
  hidden_sizes: [64, 64]
  learning_starts: 1024
  update_every: 1

evaluation:
  interval_episodes: 500
  episodes: 100
  seeds: [0, 1, 2]
