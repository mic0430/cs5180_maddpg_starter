algorithm: independent_ddpg

project:
  seed: 42
  device: auto

environment:
  num_agents: 3
  max_cycles: 25
  local_ratio: 0.5

training:
  episodes: 1000
  batch_size: 128
  replay_capacity: 100000
  learning_starts: 512
  update_every: 2

  gamma: 0.95
  tau: 0.01
  actor_lr: 0.001
  critic_lr: 0.001
  hidden_sizes: [64, 64]

  exploration_noise_std: 0.20
  exploration_noise_final: 0.05
  exploration_decay_episodes: 800

  evaluation_interval: 100
  evaluation_episodes: 5

logging:
  log_dir: runs/simple_spread_independent_ddpg_budget
  checkpoint_path: checkpoints/simple_spread_independent_ddpg_budget.pt
