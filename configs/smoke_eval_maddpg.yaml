algorithm: maddpg

project:
  seed: 42
  device: auto

environment:
  num_agents: 3
  max_cycles: 4
  local_ratio: 0.5

training:
  episodes: 4
  batch_size: 4
  replay_capacity: 200
  learning_starts: 4
  update_every: 1
  gamma: 0.95
  tau: 0.01
  actor_lr: 0.001
  critic_lr: 0.001
  hidden_sizes: [32, 32]

  exploration_noise_std: 0.2
  exploration_noise_final: 0.05
  exploration_decay_episodes: 4

  evaluation_interval: 2
  evaluation_episodes: 2

logging:
  log_dir: runs/smoke_eval_maddpg
  checkpoint_path: checkpoints/smoke_eval_maddpg.pt
